name: Tests

on:
  push:
    # main is covered by deploy-pages.yml calling this workflow as a gate — avoid running it
    # twice on the same commit. Every other branch still gets tested on push.
    branches-ignore: [main]
  pull_request:
  # Runs the full suite once a day regardless of code changes, so drift (dependency updates,
  # environment changes) gets caught even on a quiet repo.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  # Lets deploy-pages.yml gate deployment on this same suite instead of duplicating it.
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  unit:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
